<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <style>
        body { background: transparent; color: #00f2ff; font-family: 'Segoe UI', monospace; margin: 0; overflow: hidden; cursor: pointer; }
        .tv-box { 
            border: 1px solid #333; background: rgba(5, 5, 5, 0.9); padding: 12px; 
            border-left: 3px solid #00f2ff; position: relative;
        }
        .live-tag { background: #ff0055; color: white; padding: 2px 6px; font-size: 10px; font-weight: bold; display: inline-block; margin-bottom: 8px; }
        .ch-info { font-size: 11px; color: #888; letter-spacing: 1px; }
        .video-title { font-size: 14px; font-weight: bold; color: #fff; margin-top: 4px; line-height: 1.3; }
        .progress-container { width: 100%; height: 2px; background: #222; margin-top: 10px; }
        #progress-bar { height: 100%; background: #00f2ff; width: 0%; transition: width 1s; }
    </style>
</head>
<body onclick="window.top.location.href='https://www.outofthegrid.it/progetto-mira'">

    <div class="tv-box">
        <div class="live-tag">LIVE NOW</div>
        <div class="ch-info" id="ch-display">CARICAMENTO SEGNALE...</div>
        <div class="video-title" id="title-display">SINTONIZZAZIONE IN CORSO...</div>
        <div class="progress-container"><div id="progress-bar"></div></div>
    </div>

    <script>
        // Database dei video attualmente nelle tue playlist
        const schedule = [
            { ch: "CH 02 | EDUCATIONAL", title: "La bomba delle pensioni: cosa attende i giovani" },
            { ch: "CH 03 | DISCOVERY", title: "Nazario Nesta: A piedi verso l'Europa" },
            { ch: "CH 04 | GEOPOLITICA", title: "Omega Click: Verità Nascoste" }
        ];

        function refreshBox() {
            const now = new Date();
            // Cambia il video mostrato nel box ogni 15 secondi per rotazione
            const currentVideo = schedule[now.getSeconds() % schedule.length];
            
            document.getElementById('ch-display').innerText = currentVideo.ch;
            document.getElementById('title-display').innerText = currentVideo.title;
            
            // Simula l'avanzamento reale basato sui minuti dell'ora (come la tua TV)
            const progress = (now.getMinutes() / 60) * 100;
            document.getElementById('progress-bar').style.width = progress + "%";
        }

        setInterval(refreshBox, 1000);
        refreshBox();
    </script>
</body>
</html>
