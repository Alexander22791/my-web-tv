<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <style>
        body { background: transparent; color: #00f2ff; font-family: 'Segoe UI', monospace; margin: 0; overflow: hidden; cursor: pointer; }
        .tv-box { 
            border: 1px solid #333; background: rgba(5, 5, 5, 0.9); padding: 12px; 
            border-left: 3px solid #00f2ff; position: relative;
        }
        .live-tag { background: #ff0055; color: white; padding: 2px 6px; font-size: 10px; font-weight: bold; display: inline-block; margin-bottom: 8px; }
        .ch-info { font-size: 11px; color: #888; letter-spacing: 1px; }
        .video-title { font-size: 14px; font-weight: bold; color: #fff; margin-top: 4px; line-height: 1.3; }
        .progress-container { width: 100%; height: 2px; background: #222; margin-top: 10px; }
        #progress-bar { height: 100%; background: #00f2ff; width: 0%; transition: width 1s; }
    </style>
</head>
<body onclick="window.top.location.href='https://www.outofthegrid.it/progetto-mira'">

    <div class="tv-box">
        <div class="live-tag">LIVE NOW</div>
        <div class="ch-info" id="ch-display">SINCRONIZZAZIONE...</div>
        <div class="video-title" id="title-display">RECUPERO SEGNALE...</div>
        <div class="progress-container"><div id="progress-bar"></div></div>
    </div>

    <script>
        // Mappiamo i canali esattamente come nel tuo codice TV
        const schedule = [
            { id: 'ID_PLAYLIST_OUTOFTHEGRID', ch: "CH 01 | OUTOFTHEGRID", title: "CONTENUTI ORIGINALI" },
            { id: 'PL9kVuZvw_YvCad9f2carxhNQyzZPR9SHg', ch: "CH 02 | EDUCATIONAL", title: "NOVA LECTIO: APPROFONDIMENTI" },
            { id: 'PL9kVuZvw_YvBPwtYx2jxcISaPQYWmi-jy', ch: "CH 03 | DISCOVERY", title: "ESPLORAZIONI E NATURA" },
            { id: 'PL9kVuZvw_YvD2LAyUOGQvwZFt0ErQwoBa', ch: "CH 04 | GEOPOLITICA", title: "ANALISI MONDIALE" },
            { id: 'PL9kVuZvw_YvDnmUESit4RyKIYQQzsgPpE', ch: "CH 05 | SVAGO", title: "MOMENTI OFF-GRID" }
        ];

        function updateStatus() {
            const now = new Date();
            // Ruota le info ogni 12 secondi per mostrare cosa succede su tutti i canali
            const index = Math.floor((now.getSeconds() / 12) % schedule.length);
            const current = schedule[index];

            document.getElementById('ch-display').innerText = current.ch;
            document.getElementById('title-display').innerText = current.title;

            // Barra di avanzamento basata sull'ora (coerente con la TV)
            const progress = (now.getMinutes() / 60) * 100;
            document.getElementById('progress-bar').style.width = progress + "%";
        }

        setInterval(updateStatus, 1000);
        updateStatus();
    </script>
</body>
</html>
